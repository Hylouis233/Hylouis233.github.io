name: Sync GitHub stars (and auto-deploy intro site)

# Refresh GitHub star counts in src/data/academic.ts on a daily schedule
# and, if anything changed, rebuild dist-top/ and deploy it to the VPS
# that serves https://introduction.hylouis.top/.
#
# Required GitHub Actions secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   VPS_HOST    : the VPS hostname or IP. Prefer a stable public hostname when
#                 SSH is publicly reachable. If this is a Tailscale IP
#                 (100.64.0.0/10), the workflow joins the tailnet first.
#   VPS_USER    : the SSH user (normally root for the current deploy script)
#   VPS_SSH_KEY : the complete, unencrypted private SSH key, including
#                 BEGIN/END lines. Raw multiline keys and values containing
#                 literal \n separators are both accepted.
#   TAILSCALE_AUTHKEY : required only when VPS_HOST is a Tailscale IP.
#                 Prefer a tagged, reusable, ephemeral auth key.

"on":
  schedule:
    # Daily at 03:00 UTC = 11:00 Asia/Shanghai.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would change without committing or deploying"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_deploy:
        description: "Force a fresh build + deploy even if no star counts changed"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: stars-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh stars in src/data/academic.ts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run update-stars.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[dry_run] preview of changes that would be made:"
            python scripts/update-stars.py
            git diff --stat -- src/data/academic.ts || true
          else
            python scripts/update-stars.py
          fi

      - name: Commit and push (if changed)
        id: commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail

          if git diff --quiet -- src/data/academic.ts; then
            echo "No changes; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/academic.ts
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          msg=$(git diff --cached --unified=0 -- src/data/academic.ts \
            | awk '/^[-+]    stars: / { sub(/^[-+]/, ""); print }' \
            | sort -u | head -50)
          git commit -m "chore(stars): refresh GitHub star counts" \
            -m "Auto-updated by the Sync GitHub stars workflow at $ts." \
            -m "$msg"

          # main may have advanced since checkout. Rebase once and retry instead
          # of failing immediately with a non-fast-forward error.
          if ! git push origin HEAD:main; then
            echo "main advanced while this job was running; rebasing and retrying..."
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          echo "Pushed commit $(git rev-parse --short HEAD)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start another push-triggered
      # workflow. Dispatch Pages explicitly so the GitHub-hosted site receives
      # the same refreshed star counts as the VPS-hosted site.
      - name: Trigger GitHub Pages deployment (if needed)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=stars-updated

      - name: Set up Node.js (deploy only)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies (deploy only)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        run: npm ci --no-audit

      - name: Build top variant (deploy only)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        run: npm run build:top

      - name: Tar dist-top/ (deploy only)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        run: |
          tar -czf dist-top.tar.gz -C dist-top .
          ls -lh dist-top.tar.gz

      - name: Validate deploy config and prepare SSH key
        id: deploy-config
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::Missing repository secret VPS_HOST"
            exit 1
          fi
          if [ -z "${VPS_USER:-}" ]; then
            echo "::error::Missing repository secret VPS_USER"
            exit 1
          fi
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::Missing repository secret VPS_SSH_KEY"
            exit 1
          fi

          python - <<'PY'
          import ipaddress
          import os
          from pathlib import Path

          host = os.environ["VPS_HOST"].strip().strip("[]")
          try:
              ip = ipaddress.ip_address(host)
              use_tailscale = (
                  ip.version == 4
                  and ip in ipaddress.ip_network("100.64.0.0/10")
              )
          except ValueError:
              use_tailscale = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"use_tailscale={'true' if use_tailscale else 'false'}\n")

          if use_tailscale and not os.environ.get("TAILSCALE_AUTHKEY", "").strip():
              raise SystemExit(
                  "VPS_HOST is a Tailscale CGNAT address (100.64.0.0/10), but "
                  "TAILSCALE_AUTHKEY is missing. A GitHub-hosted runner cannot "
                  "route to that address until it joins the tailnet."
              )

          key = os.environ["VPS_SSH_KEY"].strip()
          # Tolerate secrets pasted with literal backslash-n separators.
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          key = key.replace("\r\n", "\n").replace("\r", "\n") + "\n"

          key_path = Path(os.environ["RUNNER_TEMP"]) / "vps_deploy_key"
          key_path.write_text(key, encoding="utf-8")
          key_path.chmod(0o600)
          PY

          if ! ssh-keygen -y -P "" -f "$RUNNER_TEMP/vps_deploy_key" >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid unencrypted private SSH key. Store the complete private key (not the .pub key) in the secret."
            exit 1
          fi

      - name: Connect GitHub runner to Tailscale
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true') &&
          steps.deploy-config.outputs.use_tailscale == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.VPS_HOST }}

      - name: Verify SSH connectivity
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/vps_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            'echo "SSH_OK $(hostname)"'

      - name: Copy dist-top.tar.gz to VPS
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote_archive="/tmp/dist-top-${GITHUB_RUN_ID}.tar.gz"
          scp \
            -i "$RUNNER_TEMP/vps_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            dist-top.tar.gz \
            "$VPS_USER@$VPS_HOST:$remote_archive"

      - name: Extract, atomically swap live site, and reload nginx
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote_archive="/tmp/dist-top-${GITHUB_RUN_ID}.tar.gz"
          ssh \
            -i "$RUNNER_TEMP/vps_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_ARCHIVE='$remote_archive' bash -s" <<'REMOTE'
          set -euo pipefail

          live=/var/www/introduction.hylouis.top
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          staged="/var/www/introduction.hylouis.top.new-${ts}"
          backup="/var/www/introduction.hylouis.top.bak-${ts}"

          cleanup() {
            rm -rf "$staged"
            rm -f "$DEPLOY_ARCHIVE"
          }
          trap cleanup EXIT

          mkdir -p "$staged"
          tar -xzf "$DEPLOY_ARCHIVE" -C "$staged"
          chown -R www-data:www-data "$staged"

          # Validate nginx before touching the live directory.
          nginx -t

          had_live=false
          if [ -e "$live" ]; then
            mv "$live" "$backup"
            had_live=true
          fi
          mv "$staged" "$live"

          if nginx -s reload; then
            echo "DEPLOYED at $ts"
          else
            echo "nginx reload failed; rolling back" >&2
            rm -rf "$live"
            if [ "$had_live" = true ]; then
              mv "$backup" "$live"
              nginx -s reload || true
            fi
            exit 1
          fi

          # Keep recent rollback copies, but avoid unbounded accumulation.
          find /var/www -maxdepth 1 -type d \
            -name 'introduction.hylouis.top.bak-*' -mtime +14 \
            -exec rm -rf {} + || true
          REMOTE
