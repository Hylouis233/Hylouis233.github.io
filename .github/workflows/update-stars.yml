name: Sync GitHub stars (and auto-deploy intro site)

# Refresh GitHub star counts in src/data/academic.ts on a daily schedule
# and, if anything changed, rebuild dist-top/ and deploy it to the VPS
# that serves https://introduction.hylouis.top/.
#
# Required GitHub Actions secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   VPS_HOST    : public VPS hostname or IP; this runner does not join the tailnet.
#   VPS_SSH_KEY : dedicated intro-site key, accepted only by deploy-intro.
# Install scripts/install-intro-deploy.sh on the VPS before enabling deployment.
# The account accepts only intro-status and a bounded static archive publish;
# it has no shell, forwarding, sudo, or nginx reload permission.

"on":
  schedule:
    # Daily at 03:00 UTC = 11:00 Asia/Shanghai.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would change without committing or deploying"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_deploy:
        description: "Force a fresh build + deploy even if no star counts changed"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: stars-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh stars in src/data/academic.ts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run update-stars.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[dry_run] preview of changes that would be made:"
            python scripts/update-stars.py
            git diff --stat -- src/data/academic.ts || true
          else
            python scripts/update-stars.py
          fi

      - name: Commit and push (if changed)
        id: commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail

          if git diff --quiet -- src/data/academic.ts; then
            echo "No changes; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/academic.ts
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          msg=$(git diff --cached --unified=0 -- src/data/academic.ts \
            | awk '/^[-+]    stars: / { sub(/^[-+]/, ""); print }' \
            | sort -u | head -50)
          git commit -m "chore(stars): refresh GitHub star counts" \
            -m "Auto-updated by the Sync GitHub stars workflow at $ts." \
            -m "$msg"

          # main may have advanced since checkout. Rebase once and retry instead
          # of failing immediately with a non-fast-forward error.
          if ! git push origin HEAD:main; then
            echo "main advanced while this job was running; rebasing and retrying..."
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          echo "Pushed commit $(git rev-parse --short HEAD)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start another push-triggered
      # workflow. Dispatch Pages explicitly so the GitHub-hosted site receives
      # the same refreshed star counts as the VPS-hosted site.
      - name: Trigger GitHub Pages deployment (if needed)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=stars-updated

      - name: Set up Node.js (deploy only)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies (deploy only)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        run: npm ci --no-audit

      - name: Build top variant (deploy only)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        run: npm run build:top

      - name: Tar dist-top/ (deploy only)
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        run: |
          tar -czf dist-top.tar.gz -C dist-top .
          ls -lh dist-top.tar.gz

      - name: Prepare restricted deployment key
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          python - <<'PYKEY'
          import os
          from pathlib import Path
          key = os.environ["VPS_SSH_KEY"].strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = Path(os.environ["RUNNER_TEMP"]) / "vps_deploy_key"
          path.write_text(key.replace("\r\n", "\n").replace("\r", "\n") + "\n")
          path.chmod(0o600)
          PYKEY
          ssh-keygen -y -P "" -f "$RUNNER_TEMP/vps_deploy_key" >/dev/null

      - name: Verify restricted deployment identity
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vps_deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ConnectTimeout=15 \
            -o ControlMaster=no -o ControlPath=none \
            -o StrictHostKeyChecking=accept-new \
            "deploy-intro@$VPS_HOST" intro-status

      - name: Publish static site through forced command
        if: |
          github.event.inputs.dry_run != 'true' &&
          (steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vps_deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ConnectTimeout=15 \
            -o ControlMaster=no -o ControlPath=none \
            -o ServerAliveInterval=10 -o StrictHostKeyChecking=accept-new \
            "deploy-intro@$VPS_HOST" "intro-deploy $GITHUB_RUN_ID" < dist-top.tar.gz

      - name: Remove temporary deployment key
        if: always()
        run: rm -f "$RUNNER_TEMP/vps_deploy_key"
